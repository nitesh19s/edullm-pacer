version: '3.8'

services:
  # EduLLM API Server
  api:
    build: .
    container_name: edullm-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_KEY=${API_KEY:-default-api-key}
      - ALLOWED_ORIGINS=http://localhost:8000,http://localhost:3000
      - RATE_LIMIT=100
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - edullm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ChromaDB (optional vector database)
  chromadb:
    image: chromadb/chroma:latest
    container_name: edullm-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped
    networks:
      - edullm-network
    profiles:
      - with-chromadb

volumes:
  chromadb-data:
    driver: local

networks:
  edullm-network:
    driver: bridge
